# HapiAC ayarları. Değişiklikten sonra: /grim reload  (restart gerekmez)
hapi:
  # Her flag'i plugins/GrimAC/hapi/flags-YYYY-AA-GG.log dosyasına yaz (alarm eşiğinin altındakiler dahil).
  # Sütunlar: saat, oyuncu, check, ihlal, dünya, ping, istemci sürümü, istemci markası, ayrıntı
  # Oyuncuyu gerçekten geri çeken her işlem de aynı dosyaya "SETBACK" satırı olarak yazılır
  # (ihlal sütunu = son 10 sn içindeki kaçıncı geri çekme; ayrıntıda neden, mesafe, konum, binek).
  # Sayaçlar için: /grim top [check|oyuncu|dunya|geri|sifirla] [adet]   (geri = nedene göre geri çekmeler)
  flag-log: true
  # Günlük log dosyası bu boyuta (MB) ulaşınca o gün yazım durur (0 = sınırsız); disk dolmasın diye
  flag-log-max-mb: 256
  # Bu kadar günden eski log dosyaları silinir (0 = silinmez)
  flag-log-keep-days: 14

  # ---------------------------------------------------------------------------
  # Vuruş modülü (sezgisel). Yalnızca oyuncu bir OYUNCUYA vurduktan sonraki
  # "window-ticks" boyunca nişan analizi yapılır. 1.21.2'den eski istemcilerde
  # (tick paketi atlayabildikleri için) ve Bedrock oyuncularında çalışmaz.
  # ---------------------------------------------------------------------------
  combat:
    enabled: true
    window-ticks: 60
    aim-snap:
      # Vuruş tickinde hedefe dönüp hemen geri dönme için en küçük açı (derece)
      min-snapback-angle: 20
      # Öncesi/sonrası hareketsizken tek tickte dönüş + vuruş için en küçük açı
      min-flick-angle: 45
    aim-grid:
      # 50 dönüşlük pencerede hassasiyet ızgarasına oturmayan dönüş oranı bu değeri aşarsa flag
      max-off-grid-ratio: 0.7
    aim-track:
      # Hareketli hedefe göre bakış sapmasının standart sapması (derece) bunun altındaysa flag
      max-offset-stddev: 0.35
    attack-rhythm:
      # 12 ardışık vuruş aralığının standart sapması (tick) bunun altındaysa flag
      max-interval-stddev: 0.45
    click-rate:
      max-attacks-per-second: 18
    target-switch:
      # En çok 2 tick arayla vurulan iki oyuncu arasındaki en küçük açı (derece); 10 sn içinde 3 tekrar flag
      min-angle: 50
    sprint-reset:
      # W-tap / S-tap makrosu: sprint reset yapılan son "sample-size" vuruşun en az "min-identical"
      # tanesinde ileri tuşu birebir aynı tickte bırakılıp aynı süre sonra basıldıysa flag
      sample-size: 10
      min-identical: 9

  # ---------------------------------------------------------------------------
  # Yapı modülü (sezgisel). Grim blok koymanın vanilla kurallarına uyduğunu denetler
  # ama scaffold sezgiseli içermez; bu üç check o boşluğu doldurur.
  # ---------------------------------------------------------------------------
  build:
    enabled: true
    scaffold-snap:
      # Blok koyarken tek tickte en az bu kadar derece dönüp, en çok "max-hold-ticks" tick içinde
      # eski bakışa geri dönme; 10 sn içinde 3 tekrar flag
      min-angle: 25
      max-hold-ticks: 8
    fast-place:
      # Üst üste bu kadar tick boyunca her tick tam bir blok koyma paketi (vanilla basılı tutma: 4 tickte bir)
      consecutive-ticks: 20
    bridge-perfect:
      # Hiç eğilmeden ve hiç boşa tıklama olmadan ayak altına üst üste bu kadar blok ekleme
      sample-size: 16
      # İki blok arasında en çok bu kadar tick geçerse seri sürer
      max-gap-ticks: 8

  # ---------------------------------------------------------------------------
  # Envanter / otomasyon modülü (sezgisel).
  # ---------------------------------------------------------------------------
  inventory:
    enabled: true
    auto-totem:
      # Tepki süresi istemci tickiyle ölçülür (oyuncunun patlamayı gördüğü andan takas paketine kadar);
      # ağ gecikmesi ölçüme karışmaz. Tepki bu kadar tick veya daha kısaysa "anında" sayılır; 2 tekrar flag
      instant-ticks: 1
      # Üst üste bu kadar tepkinin hepsi birebir aynı tick sayısıysa (en çok 8 tick) flag
      consistent-samples: 5
    burst:
      # Tek tickte bundan fazla FARKLI slota tıklama flag (shift basılı sürükleme tickte birkaç slota ulaşır).
      # Vanilla "shift + çift tık ile aynı türü topluca taşıma" sayılmaz.
      max-slots-per-tick: 6
    rhythm:
      # Farklı slotlara üst üste bu kadar tıklamanın hepsi birebir aynı tick aralığıyla gelirse flag
      # (aralık 1 tick ise eşik 1,5 katı: shift basılı sürükleme de tick başına bir slot verebilir)
      sample-size: 15

  # ---------------------------------------------------------------------------
  # Kristal modülü (sezgisel).
  # ---------------------------------------------------------------------------
  crystal:
    enabled: true
    speed:
      # Üst üste bu kadar end kristalinin hepsi, oyuncunun ekranında göründükten en çok "max-ticks" tick sonra
      # ve arada hiç boşa giden sol tık olmadan kırılırsa flag (insan sol tuşa sürekli basar, boşa tıklar)
      sample-size: 12
      max-ticks: 1

  velocity:
    jump-reset:
      # Otomatik jump reset: yerde bekleyen (en az "min-ground-ticks") ve zıplama tuşuna basmayan
      # oyuncunun aldığı son "sample-size" savrulmada, tam savrulma tickinde zıplama oranı
      # "min-ratio" değerine ulaşırsa flag. Elle yapan oyuncu bu orana çıkamaz.
      sample-size: 20
      min-ratio: 0.85
      min-ground-ticks: 3

  net:
    combat-lag:
      # Dövüş sırasındaki ortalama gecikme, oyuncunun dövüş dışı tabanından en az bu kadar ms
      # VE en az bu kat fazlaysa dövüş şüpheli sayılır; üst üste bu kadar şüpheli dövüşte flag
      min-increase-ms: 120
      min-ratio: 1.8
      fights-to-flag: 3

  # ---------------------------------------------------------------------------
  # Check başına ayarlar. Anahtar = check'in config adı (Grim'in kendi check'leri
  # dahil: Reach, TimerA (= Timer), TimerLimit, FastBreak, AirLiquidPlace, Simulation ...).
  # Yazılmayan check varsayılanlarla çalışır.
  #
  #   enabled: false              -> check hiç flag üretmez
  #   dont-alert-until: 3         -> 3. ihlale kadar yetkiliye alarm gitmez (flag yine loglanır)
  #   exempt-worlds: [dunya_adi]  -> bu dünyalarda flag üretmez
  #   setback: false              -> check flag üretir ve loglanır ama oyuncuyu geri çekmez
  #   punish-vl: 20               -> ihlal sayısı buna ulaşınca punish-command çalışır
  #   punish-command: "kick %player% Hile şüphesi (%check_name%)"
  #   punish-cooldown-seconds: 60 -> aynı oyuncuya komutun tekrar çalışması için bekleme
  #   alert-cooldown-seconds: 5   -> aynı oyuncu+check için alarm satırı en çok 5 sn'de bir (ihlal sayımı, log, ceza etkilenmez)
  #
  # Yer tutucular: %player% %check_name% %vl%
  # ---------------------------------------------------------------------------
  checks:
    AimSnap:
      enabled: true
      dont-alert-until: 1
    AimLinear:
      enabled: true
      dont-alert-until: 1
    AimGrid:
      enabled: true
      dont-alert-until: 2
    AimTrack:
      enabled: true
      dont-alert-until: 2
    AttackRhythm:
      enabled: true
      dont-alert-until: 1
    ClickRate:
      enabled: true
      dont-alert-until: 1
    AimAxis:
      enabled: true
      dont-alert-until: 1
    HitAccuracy:
      enabled: true
      dont-alert-until: 2
    WallHit:
      enabled: true
      dont-alert-until: 2
    TargetSwitch:
      enabled: true
      dont-alert-until: 1
    InventoryHit:
      enabled: true
      dont-alert-until: 2
    CombatLag:
      enabled: true
      dont-alert-until: 1
    SprintReset:
      enabled: true
      dont-alert-until: 1
    JumpReset:
      enabled: true
      dont-alert-until: 1
    ScaffoldSnap:
      enabled: true
      dont-alert-until: 1
    FastPlace:
      enabled: true
      dont-alert-until: 1
    BridgePerfect:
      enabled: true
      dont-alert-until: 2
    AutoTotem:
      enabled: true
      dont-alert-until: 1
    InventoryBurst:
      enabled: true
      dont-alert-until: 1
    InventoryRhythm:
      enabled: true
      dont-alert-until: 2
    SilentSwap:
      enabled: true
      dont-alert-until: 1
    CrystalSpeed:
      enabled: true
      dont-alert-until: 1
    # Oyuncuya henüz gönderilmemiş varlık kimliğine vuruş (kristal kimliği tahmini)
    AttackPredict:
      enabled: true
      dont-alert-until: 2
    # Bağlantı takılması sonrası toparlanma bu üç check'te saniyede onlarca alarm üretir
    TimerA:
      alert-cooldown-seconds: 5
    TimerLimit:
      alert-cooldown-seconds: 5
    TickTimer:
      alert-cooldown-seconds: 5
