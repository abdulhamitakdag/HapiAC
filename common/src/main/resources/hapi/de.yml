# HapiAC ayarları. Değişiklikten sonra: /grim reload  (restart gerekmez)
hapi:
  # Her flag'i plugins/GrimAC/hapi/flags-YYYY-AA-GG.log dosyasına yaz (alarm eşiğinin altındakiler dahil).
  # Sayaçlar için: /grim top [check|oyuncu|dunya|sifirla] [adet]
  flag-log: true

  # ---------------------------------------------------------------------------
  # Vuruş modülü (sezgisel). Yalnızca oyuncu bir OYUNCUYA vurduktan sonraki
  # "window-ticks" boyunca nişan analizi yapılır. 1.21.2'den eski istemcilerde
  # (tick paketi atlayabildikleri için) ve Bedrock oyuncularında çalışmaz.
  # ---------------------------------------------------------------------------
  combat:
    enabled: true
    window-ticks: 60
    aim-snap:
      # Vuruş tickinde hedefe dönüp hemen geri dönme için en küçük açı (derece)
      min-snapback-angle: 20
      # Öncesi/sonrası hareketsizken tek tickte dönüş + vuruş için en küçük açı
      min-flick-angle: 45
    aim-grid:
      # 50 dönüşlük pencerede hassasiyet ızgarasına oturmayan dönüş oranı bu değeri aşarsa flag
      max-off-grid-ratio: 0.7
    aim-track:
      # Hareketli hedefe göre bakış sapmasının standart sapması (derece) bunun altındaysa flag
      max-offset-stddev: 0.35
    attack-rhythm:
      # 12 ardışık vuruş aralığının standart sapması (tick) bunun altındaysa flag
      max-interval-stddev: 0.45
    click-rate:
      max-attacks-per-second: 18

  # ---------------------------------------------------------------------------
  # Check başına ayarlar. Anahtar = check'in config adı (Grim'in kendi check'leri
  # dahil: Reach, Timer, TimerLimit, FastBreak, AirLiquidPlace, Simulation ...).
  # Yazılmayan check varsayılanlarla çalışır.
  #
  #   enabled: false              -> check hiç flag üretmez
  #   dont-alert-until: 3         -> 3. ihlale kadar yetkiliye alarm gitmez (flag yine loglanır)
  #   exempt-worlds: [dunya_adi]  -> bu dünyalarda flag üretmez
  #   punish-vl: 20               -> ihlal sayısı buna ulaşınca punish-command çalışır
  #   punish-command: "kick %player% Hile şüphesi (%check_name%)"
  #   punish-cooldown-seconds: 60 -> aynı oyuncuya komutun tekrar çalışması için bekleme
  #
  # Yer tutucular: %player% %check_name% %vl%
  # ---------------------------------------------------------------------------
  checks:
    AimSnap:
      enabled: true
      dont-alert-until: 1
    AimLinear:
      enabled: true
      dont-alert-until: 1
    AimGrid:
      enabled: true
      dont-alert-until: 2
    AimTrack:
      enabled: true
      dont-alert-until: 2
    AttackRhythm:
      enabled: true
      dont-alert-until: 1
    ClickRate:
      enabled: true
      dont-alert-until: 1
    AimAxis:
      enabled: true
      dont-alert-until: 1
    HitAccuracy:
      enabled: true
      dont-alert-until: 2
    WallHit:
      enabled: true
      dont-alert-until: 2
